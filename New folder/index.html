<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #numberDisplay {
            font-size: 36px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1>Number Display</h1>
    <div id="numberDisplay">Loading...</div>

    <script>
        window.onload = function() {
            // Load the number from the file
            fetch('number.txt')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('numberDisplay').textContent = data;
                })
                .catch(error => {
                    console.error('Error fetching number:', error);
                });
        };
    </script>
</body>
</html>
